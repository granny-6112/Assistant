# Builds the Windows installer and publishes it as a GitHub release, which is
# where installed copies of Assistant look for updates. Runs whenever
# package.json changes on main, so bumping "version" is all a release takes;
# electron-builder creates the v<version> tag and skips versions already released.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
