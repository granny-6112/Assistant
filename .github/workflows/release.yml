# Builds the Windows installer and publishes it as a GitHub release, which is
# where installed copies of Assistant look for updates. Runs whenever
# package.json changes on main, so bumping "version" is all a release takes;
# electron-builder creates the v<version> tag and skips versions already released.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      # Upload with gh rather than electron-builder's publisher: it creates the
      # v<version> tag itself and, on a re-run, replaces the files in place.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          files="dist/Assistant-Setup-$v.exe dist/Assistant-Setup-$v.exe.blockmap dist/latest.yml"
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" $files --clobber
            gh release edit "v$v" --draft=false --latest
          else
            gh release create "v$v" $files --target "$GITHUB_SHA" --title "Assistant $v" --generate-notes --latest
          fi
